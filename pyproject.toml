[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gdg-domo-mcp-server"
version = "0.1.0"
description = "MCP server exposing Domo internal APIs as tools"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
domo-mcp-server = "src.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]
